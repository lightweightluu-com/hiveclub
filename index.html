<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2ec" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Hive Club Zürich: Techno, House und Morphing Clubbing an der Geroldstrasse 5. Programm, Residents, Öffnungszeiten und Newsletter." />
    <meta property="og:title" content="Hive Club Zürich" />
    <meta property="og:description" content="Morphing Clubbing – Elektro, Techno, Techhouse und Deep House in Zürich West." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Vor dem ersten Paint: gespeichertes Theme setzen, Standard ist hell.
      try {
        var t = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#07070a' : '#f5f2ec';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <title>Hive Club Zürich</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
